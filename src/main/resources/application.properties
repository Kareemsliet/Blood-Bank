spring.application.name=BloodBank
server.port=8080

# Database Connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/blood_bank
spring.datasource.username=root
spring.datasource.password=root

# Hibernate/JPA settings (complete Flyway coverage is not yet available)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

## JWT Configuration
auth.jwt.secret=aed83aaf-70c5-4e42-995b-000f0dc3f6af
auth.jwt.expiration=3600000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false